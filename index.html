<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101624">
<meta name="description" content="Néon Noir, 25 enquêtes de déduction pour la saison Cyberpunk.">
<title>Néon Noir · Enquêtes cyberpunk</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #101624;
    --paper: #f5f0df;
    --muted: #b0bbca;
    --surface: #1b2639;
    --line: #455269;
    --acid: #e8ff64;
    --cyan: #91f7e6;
    --pink: #ff9bc9;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--paper);
    background: radial-gradient(ellipse at top, #26364c, transparent 75%), var(--ink);
  }
  button { font: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; z-index: 4; }
  button:disabled { cursor: default; opacity: .45; }
  svg { display: block; }
  .game {
    width: min(100%, 1120px);
    margin-inline: auto;
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    height: 100vh;
    height: 100dvh;
    min-height: 498px;
    display: grid;
    grid-template-rows: auto auto minmax(205px, 1fr) auto auto auto;
    grid-template-areas: "header" "meta" "stage" "roster" "clue" "tools";
    gap: 6px;
  }
  .masthead {
    grid-area: header;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 5px;
    border-bottom: 2px solid var(--acid);
  }
  .masthead h1 {
    margin: 1px 0 0;
    font-size: clamp(16px, 5vw, 25px);
    line-height: 1.05;
    font-weight: 950;
    letter-spacing: -.035em;
    text-wrap: balance;
  }
  .series, .technical {
    font: 750 .66rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .085em;
    text-transform: uppercase;
  }
  .series { color: var(--acid); white-space: nowrap; }
  .series .slashes { color: var(--pink); }
  .head-actions { display: flex; align-items: center; gap: 5px; }
  .pill {
    min-height: 38px;
    padding: 0 9px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--surface);
    color: var(--paper);
    font-size: .73rem;
    font-weight: 800;
    white-space: nowrap;
  }
  .pill.dossiers { color: var(--ink); background: var(--acid); border-color: var(--acid); }
  .meta {
    grid-area: meta;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
    min-height: 34px;
  }
  .meta .technical { color: var(--cyan); }
  .plan-caption { min-width: 0; }
  .status {
    min-height: 1.2em;
    margin: 2px 0 0;
    color: var(--muted);
    font-size: .72rem;
    line-height: 1.2;
  }
  .status[data-kind="bad"] { color: #ffb7b2; }
  .status[data-kind="ok"] { color: var(--acid); }
  .legend-button { min-height: 32px; }
  .stage {
    grid-area: stage;
    min-height: 0;
    min-width: 0;
    display: grid;
    place-items: center;
    container-type: size;
  }
  .board {
    position: relative;
    display: grid;
    container-type: inline-size;
    grid-template: repeat(8, minmax(0, 1fr)) / repeat(8, minmax(0, 1fr));
    isolation: isolate;
    width: min(100%, calc(100vh - 276px), 560px);
    width: min(100%, calc(100dvh - 276px), 560px);
    min-width: min(100%, 200px);
    aspect-ratio: 1;
    border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px #0a0e17, 0 4px 16px #0a0e1788;
  }
  @supports (width: 1cqh) {
    .board { width: min(100cqw, 100cqh, 560px); }
  }
  .cell {
    --floor: #a8dbcf;
    position: relative;
    min-width: 0;
    min-height: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    color: var(--ink);
    background-color: var(--floor);
    background-image: var(--grain);
    box-shadow: inset -1px -1px #10162433;
    -webkit-tap-highlight-color: transparent;
  }
  .floor-0 { --floor: #94e3d1; --grain: repeating-linear-gradient(135deg, transparent 0 7px, #10494b18 7px 8px); }
  .floor-1 { --floor: #cdbdf7; --grain: radial-gradient(#33144e33 1px, transparent 1px); background-size: 6px 6px; }
  .floor-2 { --floor: #ffd786; --grain: repeating-linear-gradient(0deg, transparent 0 8px, #8c4a261d 8px 9px); }
  .floor-3 { --floor: #ffb5ac; --grain: repeating-linear-gradient(90deg, transparent 0 8px, #8c323018 8px 9px); }
  .floor-4 { --floor: #accbff; --grain: repeating-linear-gradient(45deg, transparent 0 10px, #233d7c26 10px 11px); }
  .floor-5 { --floor: #d0e891; --grain: radial-gradient(#41491438 1px, transparent 1px); background-size: 8px 8px; }
  .cell::after {
    content: "";
    position: absolute;
    z-index: 2;
    pointer-events: none;
    inset: 0;
    border-right: var(--wall-right, 0px) solid var(--ink);
    border-bottom: var(--wall-bottom, 0px) solid var(--ink);
  }
  .room-plaque {
    position: absolute;
    z-index: 4;
    pointer-events: none;
    left: 2px;
    top: 2px;
    max-width: calc(100% - 5px);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 1px 3px;
    border: 1px solid var(--ink);
    border-bottom: 2px solid var(--floor);
    border-radius: 2px;
    background: var(--ink);
    color: #fff8e9;
    font: 900 .52rem/1 system-ui, sans-serif;
    font-size: clamp(.37rem, var(--plaque-size, 2.45cqw), .82rem);
    letter-spacing: .015em;
    text-transform: uppercase;
  }
  .object {
    position: absolute;
    inset: 9%;
    z-index: 1;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .object svg, .furniture-span svg { width: 100%; height: 100%; }
  .cell.plaque-tile .object { top: 33%; bottom: 3%; }
  .furniture-span {
    position: absolute;
    z-index: 1;
    pointer-events: none;
    inset: 7% 4%;
  }
  .cell.object-focus .object, .furniture-span.object-focus {
    filter: drop-shadow(0 0 1px #102033) drop-shadow(0 0 3px #f5ff71);
    animation: signal-object .39s cubic-bezier(.2,.8,.2,1);
  }
  .board-fx {
    position: absolute;
    inset: 0;
    z-index: 5;
    overflow: hidden;
    pointer-events: none;
  }
  .scan-beam {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, transparent 27%, #51ffdd88 49%, #e6ff8b 50%, transparent 51%);
    animation: read-plan .62s cubic-bezier(.18,.67,.35,1) both;
  }
  .line-beam {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    inset: 0;
    background: #dfff7a;
    transform-origin: left center;
    animation: row-pulse .42s cubic-bezier(.2,.8,.4,1) both;
  }
  .line-beam.column { transform-origin: center top; animation-name: column-pulse; }
  .cell.blocked { background-color: color-mix(in srgb, var(--floor) 73%, #63758d); }
  .cell.blocked::before {
    content: "×";
    position: absolute;
    z-index: 1;
    right: 10%;
    bottom: 9%;
    color: #1d294e9c;
    font: 760 clamp(.76rem, 4vw, 1.4rem)/.8 system-ui, sans-serif;
    pointer-events: none;
  }
  .cell.blocked:not(.has-object)::before { inset: 0; display: grid; place-items: center; }
  .note {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 3;
    place-items: center;
    font-size: clamp(1.15rem, 6vw, 2.4rem);
    line-height: 1;
    font-weight: 900;
    color: #fdf7f1;
    text-shadow: -1px -1px #641944, 1px -1px #641944, 1px 1px #641944, -1px 1px #641944, 0 0 4px #641944;
    pointer-events: none;
  }
  .cell.noted .note { display: grid; }
  .token {
    display: none;
    position: absolute;
    z-index: 3;
    inset: 14%;
    place-items: center;
    border-radius: 25%;
    border: 2px solid var(--ink);
    color: var(--ink);
    background: var(--person, var(--acid));
    font-size: clamp(.62rem, 3vw, 1.12rem);
    line-height: 1;
    font-weight: 950;
    box-shadow: 0 2px 0 #10162495;
    pointer-events: none;
  }
  .cell.occupied .token { display: grid; }
  .cell.plaque-tile .token { inset: 36% 15% 8%; }
  .cell.occupied .object { opacity: .4; }
  .token.victim { border-style: dashed; }
  .cell.selected-piece .token { outline: 2px solid white; }
  .cell.right .token { outline: 2px solid #146436; }
  .cell.wrong .token { outline: 3px solid #b1003a; }
  .roster {
    grid-area: roster;
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 3px;
  }
  .person {
    position: relative;
    min-width: 0;
    min-height: 46px;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 3px;
    padding: 3px 0;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--paper);
  }
  .person[aria-pressed="true"] { color: var(--ink); background: var(--acid); border-color: var(--acid); }
  .portrait {
    position: relative;
    display: grid;
    place-items: center;
    width: 23px;
    height: 23px;
    border: 1px solid var(--ink);
    border-radius: 5px;
    background: var(--person, var(--acid));
    color: var(--ink);
    font: 950 .62rem/1 ui-monospace, monospace;
  }
  .portrait svg { width: 100%; height: 100%; }
  .person-name {
    max-width: 100%;
    padding: 0 1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: clamp(.56rem, 2.85vw, .79rem);
    line-height: 1;
    font-weight: 850;
  }
  .person.placed .person-name {
    text-decoration: line-through;
    text-decoration-thickness: 2px;
  }
  .person.placed .portrait::after {
    content: "✓";
    position: absolute;
    right: -4px;
    bottom: -3px;
    display: grid;
    width: 12px;
    height: 12px;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--ink);
    color: var(--ink);
    background: #ecff9a;
    font: 950 .57rem/1 system-ui, sans-serif;
  }
  .person.victim .portrait { border-style: dashed; }
  .clue {
    grid-area: clue;
    min-width: 0;
    min-height: 82px;
    display: grid;
    align-content: start;
    gap: 4px;
    padding: 5px 9px 7px;
    border-left: 4px solid var(--pink);
    border-radius: 2px 6px 6px 2px;
    color: var(--ink);
    background: var(--paper);
  }
  .clue-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    min-height: 24px;
  }
  .clue-title { font-weight: 900; font-size: .77rem; }
  .clue-title .technical { font-size: .57rem; color: #465066; }
  .clue-content { display: flex; align-items: flex-start; gap: 6px; }
  .clue-glyphs { flex: 0 0 auto; display: flex; gap: 2px; padding-top: 1px; }
  .clue-glyphs svg { width: 19px; height: 19px; }
  .clue-text { margin: 0; font-size: .82rem; line-height: 1.26; font-weight: 670; }
  .remove {
    min-height: 27px;
    border: 0;
    border-radius: 3px;
    padding: 0 6px;
    color: var(--ink);
    background: #ded9ce;
    font-size: .71rem;
    font-weight: 750;
  }
  .remove:disabled { visibility: hidden; }
  .tools {
    grid-area: tools;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
  }
  .tool {
    display: flex;
    min-height: 43px;
    justify-content: center;
    align-items: center;
    gap: 5px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--surface);
    color: var(--paper);
    font-size: .78rem;
    font-weight: 850;
    white-space: nowrap;
  }
  .tool svg { width: 15px; height: 15px; }
  .tool[aria-pressed="true"] { background: var(--pink); color: var(--ink); border-color: var(--pink); }
  .tool.primary { background: var(--acid); border-color: var(--acid); color: var(--ink); }
  .brief { grid-area: brief; display: none; }
  .room-key { display: flex; flex-wrap: wrap; gap: 5px; }
  .room-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: inherit;
    font-size: .76rem;
    font-weight: 730;
  }
  .room-chip b {
    display: grid;
    width: 19px;
    height: 19px;
    place-items: center;
    border: 1px solid var(--ink);
    border-radius: 3px;
    color: var(--ink);
    background: var(--floor);
    font: 900 .64rem/1 ui-monospace, monospace;
  }
  dialog {
    width: min(calc(100% - 22px), 515px);
    max-height: min(calc(100dvh - 16px), 690px);
    padding: 0;
    border: 2px solid var(--ink);
    border-radius: 10px;
    color: var(--ink);
    background: var(--paper);
    box-shadow: 0 18px 58px #080c16b8;
    overscroll-behavior: contain;
  }
  dialog::backdrop { background: #090e1bc9; }
  dialog[open] { animation: enter-panel .23s cubic-bezier(.2,.8,.2,1); }
  dialog[open]::backdrop { animation: reveal-backdrop .23s ease-out; }
  .dialog-head {
    position: sticky;
    z-index: 1;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 13px;
    border-bottom: 2px solid var(--ink);
    background: var(--acid);
  }
  .dialog-head h2 { margin: 0; font-size: 1.06rem; line-height: 1.15; }
  .verdict-banner {
    padding: 9px 10px;
    margin: 0 0 10px;
    border: 1px solid var(--ink);
    border-radius: 4px;
    font: 950 .72rem/1.2 ui-monospace, monospace;
    letter-spacing: .13em;
    background: linear-gradient(110deg, #bcf7df, var(--acid));
    animation: verdict-stamp .46s cubic-bezier(.2,.85,.26,1.2);
  }
  .close {
    width: 35px;
    height: 35px;
    border: 1px solid var(--ink);
    border-radius: 5px;
    background: transparent;
    color: var(--ink);
    font-size: 1.45rem;
    line-height: 1;
  }
  .dialog-body { padding: 12px 13px 15px; font-size: .89rem; line-height: 1.42; }
  .dialog-body p:first-child { margin-top: 0; }
  .dialog-body h3 { margin: 13px 0 5px; font-size: .9rem; }
  .dialog-body ol { margin: 7px 0 14px; padding-left: 1.3rem; }
  .dialog-body li + li { margin-top: 5px; }
  .dialog-button {
    min-height: 43px;
    padding: 6px 10px;
    border: 1px solid var(--ink);
    border-radius: 5px;
    color: var(--ink);
    background: #e5e3d8;
    font-size: .8rem;
    font-weight: 850;
  }
  .dialog-button.positive { background: var(--acid); }
  .dialog-actions, .object-key, .accusations { display: flex; flex-wrap: wrap; gap: 6px; }
  .object-key span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px;
    background: #e5e3d8;
    border: 1px solid #c6c2b6;
    border-radius: 5px;
    font-size: .77rem;
    font-weight: 730;
  }
  .object-key svg { width: 24px; height: 24px; }
  .season-progress { margin: 0 0 9px; color: #41485a; font-size: .8rem; }
  .case-pages {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 4px;
    margin-bottom: 8px;
  }
  .case-pages .dialog-button { min-height: 34px; padding: 2px; font-size: .69rem; }
  .case-pages [aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .level-list { display: grid; gap: 6px; }
  .level {
    display: grid;
    grid-template-columns: 32px minmax(0,1fr) auto;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 47px;
    padding: 5px 7px;
    text-align: left;
    border: 1px solid #bcb9ad;
    border-radius: 5px;
    color: var(--ink);
    background: #fffaf0;
  }
  .level[aria-current="true"] { border: 2px solid var(--ink); background: var(--acid); }
  .level .level-id { font: 950 .9rem/1 ui-monospace, monospace; }
  .level strong { display: block; font-size: .86rem; }
  .level small { display: block; color: #41485a; font-size: .71rem; }
  @media (min-width: 750px) {
    .game {
      padding: 20px;
      gap: 9px 16px;
      grid-template-columns: minmax(0, 1.25fr) minmax(290px, .85fr);
      grid-template-rows: auto auto auto auto auto minmax(0,1fr);
      grid-template-areas: "header header" "meta brief" "stage roster" "stage clue" "stage tools" "stage .";
    }
    .masthead { padding-bottom: 10px; }
    .masthead h1 { font-size: 1.85rem; }
    .head-actions { gap: 8px; }
    .pill { min-height: 42px; padding-inline: 12px; }
    .meta { align-self: start; }
    .stage { min-height: 230px; align-self: stretch; }
    .board { max-width: 560px; }
    .brief {
      display: block;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }
    .brief p { margin: 5px 0 8px; font-size: .88rem; line-height: 1.4; }
    .roster { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .person { min-height: 47px; }
    .clue { min-height: 87px; }
    .clue-text { font-size: .89rem; }
  }
  @media (max-width: 749px) and (orientation: portrait) {
    .game {
      --game-height: min(100dvh, calc(100vw + 258px));
      height: var(--game-height);
      min-height: 0;
      margin-top: max(0px, calc((100dvh - var(--game-height)) / 2));
      grid-template-rows: auto auto minmax(185px, 1fr) auto auto auto;
    }
    .board { min-width: min(100%, 185px); }
  }
  @media (min-width: 400px) and (max-width: 749px) and (orientation: portrait) {
    .game {
      --game-height: min(100dvh, calc(100vw + 325px + env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
      gap: 7px;
    }
    .masthead h1 { font-size: 1.48rem; }
    .pill, .legend-button, .close, .remove { min-height: 44px; }
    .close { width: 44px; }
    .meta .technical, .status { font-size: .79rem; }
    .person { min-height: 54px; }
    .portrait { width: 30px; height: 30px; }
    .person-name { font-size: .8rem; }
    .clue { min-height: 101px; align-content: center; }
    .clue-text { font-size: .94rem; }
    .clue-glyphs svg { width: 23px; height: 23px; }
    .tool { min-height: 49px; font-size: .87rem; }
  }
  @media (max-width: 355px), (max-height: 580px) {
    .game { gap: 4px; }
    .clue { min-height: 74px; }
    .clue-text { font-size: .77rem; }
    .person { min-height: 42px; }
    .tool { min-height: 40px; }
  }
  @media (orientation: landscape) and (max-height: 480px) and (min-width: 575px) {
    .game {
      min-height: 330px;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 1fr);
      grid-template-rows: auto auto auto auto auto minmax(0, 1fr);
      grid-template-areas: "header header" "stage meta" "stage roster" "stage clue" "stage tools" "stage .";
      column-gap: 12px;
    }
  }
  @keyframes read-plan {
    from { transform: translateY(-56%); opacity: .18; }
    30% { opacity: .9; }
    to { transform: translateY(56%); opacity: 0; }
  }
  @keyframes row-pulse {
    from { transform: scaleX(.04); opacity: .68; }
    55% { transform: scaleX(1); opacity: .38; }
    to { transform: scaleX(1); opacity: 0; }
  }
  @keyframes column-pulse {
    from { transform: scaleY(.04); opacity: .68; }
    55% { transform: scaleY(1); opacity: .38; }
    to { transform: scaleY(1); opacity: 0; }
  }
  @keyframes signal-object {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.14); }
  }
  @keyframes enter-panel {
    from { opacity: 0; transform: translateY(13px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes reveal-backdrop { from { opacity: 0; } to { opacity: 1; } }
  @keyframes verdict-stamp {
    from { transform: scale(.86) rotate(-2deg); opacity: .2; }
    65% { transform: scale(1.025); opacity: 1; }
    to { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<main class="game">
  <header class="masthead">
    <div>
      <div class="series">NÉON <span class="slashes">//</span> NOIR <span id="case-number"></span></div>
      <h1 id="case-title"></h1>
    </div>

  {"id":"01","title":"Le Dernier Set","venue":"Gridclub","difficulty":"Initiation","intro":"Une coupure interrompt le set de Nova au Gridclub. Quand les néons se rallument, on découvre le corps de la DJ. Les capteurs ont gardé huit relevés.","rooms":["AAABBBBB","AAAABBBB","CAAAABBD","CCAAADDD","CCCCDDDD","CCCEDDDD","CCCEEEED","CCEEEEEE"],"roomNames":{"A":"Réseau","B":"Régie","C":"Bar","D":"Piste","E":"Loges"},"objects":{"3":"mixer","6":"seat","13":"seat","16":"rug","18":"speaker","21":"rug","30":"seat","32":"bench","33":"rug","40":"screen","52":"bench","54":"bench","55":"screen","58":"seat","60":"seat","62":"speaker","63":"bench"},"people":[{"id":"aiko","name":"Aiko","clue":"À côté d’une enceinte.","items":["speaker"]},{"id":"brix","name":"Brix","clue":"À côté d’une table de mixage.","items":["mixer"]},{"id":"coda","name":"Coda","clue":"Sur un fauteuil, à côté d’un tapis.","items":["seat","rug"]},{"id":"dax","name":"Dax","clue":"À côté d’un écran.","items":["screen"]},{"id":"emi","name":"Emi","clue":"Sur un tapis.","items":["rug"]},{"id":"fox","name":"Fox","clue":"Sur un fauteuil.","items":["seat"]},{"id":"gaku","name":"Gaku","clue":"Sur une banquette.","items":["bench"]},{"id":"nova","name":"Nova","clue":"À côté d’un tapis.","items":["rug"]}],"victim":"nova","solution":{"aiko":19,"brix":4,"coda":13,"dax":47,"emi":33,"fox":58,"gaku":54,"nova":24},"hints":["Commence par la table de mixage. Les murs de la Régie limitent les cases où Brix peut se tenir.","Compare les fauteuils autour des tapis. Un seul fauteuil touche un tapis sans traverser de mur.","Après Brix et Coda, regarde la colonne de la table de mixage. Parmi les cases restantes, une seule correspond encore à un indice, celui d’Aiko."]},
  {"id":"02","title":"Le Quai fantôme","venue":"Station Nadir","difficulty":"Initiation","intro":"Une rame vide entre à la station Nadir. Sa conductrice, Sol, a été tuée. Les capteurs de service ont enregistré les derniers déplacements.","rooms":["AABBBBBB","AAABBBBB","AAABBBCC","AAACCCCC","DCCCCCCC","DDDCCCEE","DDDDCEEE","DDDCCEEE"],"roomNames":{"A":"Cabine","B":"Quai","C":"Hall","D":"Atelier","E":"Fret"},"objects":{"2":"locker","9":"bench","13":"screen","19":"seat","20":"scanner","21":"seat","26":"bench","27":"bench","29":"crate","32":"screen","39":"seat","40":"seat","41":"locker","45":"seat","50":"screen","54":"crate","56":"locker","58":"bench","61":"seat"},"people":[{"id":"ada","name":"Ada","clue":"À côté d’une caisse.","items":["crate"]},{"id":"bash","name":"Bash","clue":"À côté d’un fauteuil.","items":["seat"]},{"id":"chim","name":"Chim","clue":"Sur un fauteuil, à côté d’un écran.","items":["seat","screen"]},{"id":"drift","name":"Drift","clue":"À côté d’une banquette.","items":["bench"]},{"id":"enzo","name":"Enzo","clue":"À côté d’un écran.","items":["screen"]},{"id":"faye","name":"Faye","clue":"Sur une banquette.","items":["bench"]},{"id":"glitch","name":"Glitch","clue":"À côté d’un scanner et d’un écran.","items":["scanner","screen"]},{"id":"sol","name":"Sol","clue":"Sur un fauteuil, à côté d’un casier.","items":["seat","locker"]}],"victim":"sol","solution":{"ada":55,"bash":38,"chim":21,"drift":1,"enzo":58,"faye":27,"glitch":12,"sol":40},"hints":["Repère tous les fauteuils voisins d’un casier dans leur propre pièce. Ce sont les seules options pour Sol.","Deux fauteuils touchent un écran. L’un d’eux est déjà occupé par Sol. L’autre revient à Chim.","Cherche les cases où un scanner et un écran sont voisins de la même personne. La pose de Chim en élimine une pour Glitch."]},
  {"id":"03","title":"La Greffe de minuit","venue":"Clinique Mirage","difficulty":"Initiation","intro":"Un implant disparaît du bloc de la clinique Mirage. Sélène, qui devait en signer le transfert, a été tuée. Les balises de la clinique parlent encore.","rooms":["AAAABBBC","AAADBBCC","AADDDBCC","AADDDCCC","EEDDDCFF","EEEDDFFF","EEEEFFFF","EEEFFFFF"],"roomNames":{"A":"Triage","B":"Labo","C":"Cryo","D":"Bloc","E":"Soins","F":"Réveil"},"objects":{"2":"rug","5":"scanner","8":"seat","10":"scanner","12":"rug","16":"bed","18":"pod","30":"seat","31":"seat","32":"bed","33":"seat","46":"desk","47":"desk","50":"scanner","51":"scanner","52":"scanner","54":"seat","55":"bed","58":"desk","63":"bed"},"people":[{"id":"argo","name":"Argo","clue":"Sur un fauteuil, à côté d’un bureau.","items":["seat","desk"]},{"id":"byte","name":"Byte","clue":"Sur un tapis.","items":["rug"]},{"id":"cipher","name":"Cipher","clue":"À côté d’un fauteuil.","items":["seat"]},{"id":"delta","name":"Delta","clue":"À côté d’un caisson.","items":["pod"]},{"id":"echo","name":"Echo","clue":"Sur un fauteuil.","items":["seat"]},{"id":"flux","name":"Flux","clue":"À côté d’un lit.","items":["bed"]},{"id":"ghost","name":"Ghost","clue":"Sur un tapis, à côté d’un scanner.","items":["rug","scanner"]},{"id":"selene","name":"Sélène","clue":"Sur un lit.","items":["bed"]}],"victim":"selene","solution":{"argo":54,"byte":12,"cipher":29,"delta":19,"echo":33,"flux":40,"ghost":2,"selene":63},"hints":["Repère les fauteuils qui touchent un bureau dans leur pièce. Un seul peut accueillir Argo.","Compare les tapis voisins des scanners. Celui du Labo n’a pas de scanner sur un de ses quatre côtés.","Une fois Ghost placé sur son tapis, cherche quel autre tapis peut encore accueillir Byte."]},
  {"id":"04","title":"Le Pli noir","venue":"Tri postal Fret 8","difficulty":"Initiation","intro":"Une capsule de données disparaît pendant la relève. Lin, qui devait en signer la livraison, a été tuée. Les capteurs du centre de tri ont gardé les relevés.","rooms":["AAABBBBB","AAABBBBB","AAAACBBB","DDACCCBB","DDDCCCCE","DDDDCCEE","DDDDCEEE","DDDDEEEE"],"roomNames":{"A":"Sas","B":"Tri","C":"Contrôle","D":"Quai","E":"Consigne"},"objects":{"0":"locker","1":"crate","6":"locker","7":"seat","8":"seat","9":"scanner","10":"crate","11":"bench","12":"seat","17":"bench","21":"scanner","27":"locker","41":"crate","42":"seat","43":"pallet","48":"bench","50":"bench","53":"pallet","54":"scanner"},"people":[{"id":"sumi","name":"Sumi","clue":"À côté d’un casier.","items":["locker"]},{"id":"kern","name":"Kern","clue":"À côté d’un fauteuil.","items":["seat"]},{"id":"pia","name":"Pia","clue":"Sur un fauteuil.","items":["seat"]},{"id":"ivo","name":"Ivo","clue":"À côté d’un scanner.","items":["scanner"]},{"id":"mina","name":"Mina","clue":"Sur une banquette, à côté d’un scanner.","items":["bench","scanner"]},{"id":"holt","name":"Holt","clue":"Sur une banquette, à côté d’un fauteuil.","items":["bench","seat"]},{"id":"rin","name":"Rin","clue":"À côté d’une palette.","items":["pallet"]},{"id":"lin","name":"Lin","clue":"Sur une banquette.","items":["bench"]}],"victim":"lin","solution":{"sumi":28,"kern":34,"pia":7,"ivo":46,"mina":17,"holt":11,"rin":61,"lin":48},"hints":["Passe les banquettes en revue. Une seule touche un scanner sans traverser de mur.","Une fois Mina placée, examine la rangée du casier du Contrôle. La seule option restante y touche le casier et correspond à Sumi.","Regarde la rangée du haut après avoir placé Sumi. Pour la remplir, il reste un fauteuil du Tri qui correspond à l’indice de Pia."]},
  {"id":"05","title":"La Dernière Charge","venue":"Centrale Silex","intro":"La centrale perd sa dernière batterie active. Le technicien Oren a été tué pendant la panne. Les capteurs de secours n’ont gardé que les traces proches du mobilier.","rooms":["AABBBBBB","AAABBCBB","AAAAACCC","DAAAACCE","DDDCCCEE","DDFFCCEE","DDFFFEEE","DFFFFEEE"],"roomNames":{"A":"Contrôle","B":"Cellules","C":"Circuit","D":"Quai","E":"Atelier","F":"Réserve"},"difficulty":"Facile","objects":{"0":"scanner","3":"scanner","5":"seat","7":"scanner","9":"seat","23":"terminal","28":"scanner","30":"seat","37":"terminal","38":"terminal","39":"scanner","42":"seat","46":"rug","48":"rug","49":"crate","52":"crate","55":"terminal","58":"battery","60":"crate","63":"crate"},"people":[{"id":"ari","name":"Ari","clue":"Sur un fauteuil, dans la même pièce que Célia.","items":["seat"]},{"id":"bolt","name":"Bolt","clue":"À côté d’un scanner, dans une pièce sans tapis.","items":["scanner","rug"]},{"id":"celia","name":"Célia","clue":"À côté d’un scanner.","items":["scanner"]},{"id":"dune","name":"Dune","clue":"À côté d’une batterie et d’un fauteuil.","items":["battery","seat"]},{"id":"eko","name":"Eko","clue":"À côté d’un tapis.","items":["rug"]},{"id":"fara","name":"Fara","clue":"À côté d’un terminal.","items":["terminal"]},{"id":"gio","name":"Gio","clue":"Sur un tapis, dans une pièce sans fauteuil.","items":["rug","seat"]},{"id":"oren","name":"Oren","clue":"À côté d’un fauteuil.","items":["seat"]}],"victim":"oren","solution":{"ari":5,"bolt":27,"celia":15,"dune":50,"eko":56,"fara":36,"gio":46,"oren":17},"hints":["Cherche dans la Réserve une case qui touche à la fois la batterie et un fauteuil. Dune doit respecter les deux conditions.","Gio peut utiliser un tapis dans deux pièces sans fauteuil. La rangée de Dune condamne le tapis du Quai.","Une fois Dune et Gio placés, reviens aux cases à côté des tapis. Compare celles du Quai et de l’Atelier pour Eko."]},
  {"id":"06","title":"Le Signal pirate","venue":"Relais Obsidienne","difficulty":"Facile","intro":"Un signal pirate coupe le relais Obsidienne pendant sa dernière diffusion. L’opératrice Ione a été tuée. Les journaux de proximité sont intacts.","rooms":["AAABBBBB","AAABBCCC","AAAABCCC","DDAABBCC","DDAEEBCC","DDEEEFFF","DDDEEEFF","DDDDEEFF"],"roomNames":{"A":"Archive","B":"Passerelle","C":"Veille","D":"Quai","E":"Sas","F":"Émetteur"},"objects":{"3":"bench","5":"seat","8":"rug","10":"seat","17":"bench","24":"terminal","26":"rug","33":"terminal","36":"seat","37":"terminal","39":"seat","45":"rug","48":"bench","53":"screen","54":"screen","55":"terminal","58":"bench","62":"antenna","63":"terminal"},"people":[{"id":"alix","name":"Alix","clue":"Sur un tapis, dans une pièce avec une antenne.","items":["rug","antenna"]},{"id":"blue","name":"Blue","clue":"Sur un fauteuil.","items":["seat"]},{"id":"cyra","name":"Cyra","clue":"À côté d’un fauteuil, dans la même pièce qu’Ezra.","items":["seat"]},{"id":"driss","name":"Driss","clue":"À côté d’une banquette.","items":["bench"]},{"id":"ezra","name":"Ezra","clue":"À côté d’une banquette, dans une pièce avec un fauteuil.","items":["bench","seat"]},{"id":"fenn","name":"Fenn","clue":"À côté d’un écran.","items":["screen"]},{"id":"gris","name":"Gris","clue":"À côté d’exactement deux terminaux.","items":["terminal"]},{"id":"ione","name":"Ione","clue":"Sur une banquette.","items":["bench"]}],"victim":"ione","solution":{"alix":45,"blue":39,"cyra":6,"driss":16,"ezra":11,"fenn":52,"gris":25,"ione":58},"hints":["Cherche l’antenne, puis les tapis de sa pièce. Un seul tapis peut accueillir Alix.","L’Émetteur et le Sas ont chacun un écran. Barre les cases proches d’un écran dans la rangée et la colonne prises par Alix pour trouver Fenn.","Dans le Quai, deux cases touchent les deux terminaux. Pour les départager, demande-toi qui peut encore occuper la rangée du terminal isolé contre le bord gauche."]},
  {"id":"07","title":"L’Ombre du drone","venue":"Hangar Éclipse","intro":"Le registre annonce un décollage sans pilote. Nao, qui devait réceptionner le drone, a été tué dans le hangar. La sécurité a relevé les positions autour du matériel.","rooms":["AAABBBBB","AAAAABBB","DAAACBBB","DAACCCBB","DDCCCCCE","DDDDCCEE","DDDDCCEE","DDDEEEEE"],"roomNames":{"A":"Bureau","B":"Piste","C":"Atelier","D":"Fret","E":"Sas"},"difficulty":"Facile","objects":{"1":"crate","8":"bench","17":"bench","20":"bench","21":"scanner","23":"desk","25":"seat","26":"desk","27":"crate","30":"robot","36":"crate","37":"scanner","38":"scanner","39":"desk","45":"robot","47":"seat","56":"seat","57":"bench","63":"crate"},"people":[{"id":"axel","name":"Axel","clue":"À côté d’une banquette.","items":["bench"]},{"id":"brume","name":"Brume","clue":"À côté d’un bureau.","items":["desk"]},{"id":"cleo","name":"Cléo","clue":"À côté d’exactement deux caisses, dans la même pièce que Dja.","items":["crate"]},{"id":"dja","name":"Dja","clue":"Sur une banquette.","items":["bench"]},{"id":"eden","name":"Eden","clue":"À côté d’un drone.","items":["robot"]},{"id":"faun","name":"Faun","clue":"Sur un fauteuil, à côté d’un bureau.","items":["seat","desk"]},{"id":"gwen","name":"Gwen","clue":"À côté d’un fauteuil, sans caisse à côté.","items":["seat","crate"]},{"id":"nao","name":"Nao","clue":"À côté d’une banquette, dans une pièce avec une caisse.","items":["bench","crate"]}],"victim":"nao","solution":{"axel":58,"brume":15,"cleo":35,"dja":20,"eden":53,"faun":25,"gwen":46,"nao":0},"hints":["Les deux cases voisines de deux caisses sont dans l’Atelier. Une seule est compatible avec la rangée et la colonne de sa banquette.","Après Cléo et Dja, cherche une colonne où seule une case à côté d’une banquette reste possible pour Axel.","Une fois Axel placé, regarde la rangée du haut. Parmi les cases près d’une banquette, laquelle est dans une pièce avec une caisse ?"]},
  {"id":"08","title":"Les Nuits du chrome","venue":"Hôtel Hélios","intro":"Les portes de l’hôtel se verrouillent après le couvre-feu. Lyne, la réceptionniste, a été tuée. Il reste huit relevés dans le registre du mobilier connecté.","rooms":["AABBBBBB","AAABBBCC","AAAABCCC","DAAACCCC","DDAACCCE","DDDEEECE","DDDEEEEE","DDDDEEEE"],"roomNames":{"A":"Hall","B":"Salon","C":"Suites","D":"Service","E":"Repos"},"difficulty":"Facile","objects":{"10":"counter","12":"bed","19":"counter","24":"bed","26":"locker","27":"rug","29":"rug","30":"rug","31":"screen","37":"locker","38":"locker","39":"locker","43":"seat","47":"seat","50":"seat","51":"seat","54":"locker","56":"bed","62":"rug"},"people":[{"id":"anya","name":"Anya","clue":"À côté d’un lit.","items":["bed"]},{"id":"borel","name":"Borel","clue":"Sur un lit, sans comptoir à côté.","items":["bed","counter"]},{"id":"ciel","name":"Ciel","clue":"À côté d’un comptoir.","items":["counter"]},{"id":"dai","name":"Daï","clue":"Sur un fauteuil.","items":["seat"]},{"id":"elio","name":"Elio","clue":"Sur un tapis, à côté d’un écran.","items":["rug","screen"]},{"id":"fran","name":"Fran","clue":"À côté d’un tapis, dans la même pièce que Gaël.","items":["rug"]},{"id":"gael","name":"Gaël","clue":"À côté d’un casier.","items":["locker"]},{"id":"lyne","name":"Lyne","clue":"À côté d’un casier, dans une pièce sans comptoir.","items":["locker","counter"]}],"victim":"lyne","solution":{"anya":4,"borel":56,"ciel":9,"dai":47,"elio":30,"fran":35,"gael":18,"lyne":53},"hints":["Il n’y a qu’un écran à l’hôtel. Compare les tapis qui le touchent dans sa propre pièce pour placer Elio.","Après Elio, cherche une rangée où un seul personnage peut encore se tenir. Dans le Salon, le lit est un bon point de départ pour Anya.","Pour Borel, écarte le lit du Salon dans la colonne d’Anya et le lit du Service dans la rangée d’Elio."]},
  {"id":"09","title":"La Mise perdue","venue":"Casino Tesseract","difficulty":"Facile","intro":"Le coffre du casino affiche un solde impossible. Nera, responsable des mises, est retrouvée morte.","rooms":["AAABBBBB","AAABBBBC","AABBBBCC","ADDDBCCC","DDDDDCCC","DDEEEECC","DEEEEEEC","DEEEEEEE"],"roomNames":{"A":"Hall","B":"Tables","C":"Salon","D":"Caisse","E":"Coffre"},"objects":{"0":"seat","1":"seat","5":"counter","7":"rug","15":"bench","18":"seat","19":"seat","20":"table","21":"rug","22":"table","23":"bench","28":"terminal","29":"bench","34":"bench","38":"table","40":"counter","45":"terminal","50":"rug","55":"table","56":"counter","63":"terminal"},"people":[{"id":"kira","name":"Kira","clue":"À côté d’une table.","items":["table"]},{"id":"milo","name":"Milo","clue":"À côté d’un terminal.","items":["terminal"]},{"id":"zara","name":"Zara","clue":"À côté d’exactement deux comptoirs.","items":["counter"]},{"id":"rook","name":"Rook","clue":"Sur un fauteuil.","items":["seat"]},{"id":"vance","name":"Vance","clue":"Sur une banquette.","items":["bench"]},{"id":"suki","name":"Suki","clue":"Sur une banquette, à côté d’une table.","items":["bench","table"]},{"id":"nix","name":"Nix","clue":"À côté d’une banquette.","items":["bench"]},{"id":"nera","name":"Nera","clue":"À côté d’un tapis, seule avec le coupable.","items":["rug"]}],"victim":"nera","solution":{"kira":12,"milo":62,"zara":48,"rook":1,"vance":29,"suki":23,"nix":35,"nera":42},"hints":["Repère les comptoirs. Une seule case touche exactement deux comptoirs dans une même pièce.","Suki est assise. Compare les banquettes qui ont une table comme voisine dans leur pièce.","Les poses de Zara et Suki barrent trois fauteuils. Il en reste un pour Rook."]},
  {"id":"10","title":"Chambre Zéro","venue":"Hôtel Somnus","difficulty":"Facile","intro":"Une cliente ne se réveille pas. Son nom, Vela, vient de disparaître du registre de l’hôtel.","rooms":["AAAABBBB","AAACBBBB","AACCCBBB","ACCCCCBB","DDCCCEEE","DDDCEEEE","DDDDEEEE","DDDDEEEE"],"roomNames":{"A":"Accueil","B":"Nuit","C":"Couloir","D":"Lingerie","E":"Bains"},"objects":{"6":"bed","7":"rug","10":"bench","13":"rug","14":"rug","17":"terminal","19":"bed","24":"bench","29":"pod","30":"bed","38":"dispenser","39":"bench","47":"bench","49":"dispenser","55":"terminal","56":"rug","58":"pod","59":"pod","60":"pod"},"people":[{"id":"lyn","name":"Lyn","clue":"À côté d’un caisson.","items":["pod"]},{"id":"ash","name":"Ash","clue":"Sur une banquette, à côté d’un distributeur.","items":["bench","dispenser"]},{"id":"jett","name":"Jett","clue":"À côté d’exactement deux tapis.","items":["rug"]},{"id":"rami","name":"Rami","clue":"À côté d’un distributeur et d’un caisson.","items":["dispenser","pod"]},{"id":"oki","name":"Oki","clue":"Sur une banquette.","items":["bench"]},{"id":"mina","name":"Mina","clue":"À côté d’un tapis.","items":["rug"]},{"id":"tess","name":"Tess","clue":"Sur un lit.","items":["bed"]},{"id":"vela","name":"Vela","clue":"À côté d’un distributeur, seule avec le coupable.","items":["dispenser"]}],"victim":"vela","solution":{"lyn":61,"ash":39,"jett":6,"rami":50,"oki":24,"mina":12,"tess":19,"vela":41},"hints":["Repère les banquettes voisines d’un distributeur. Une seule correspond à la fiche d’Ash.","Jett touche deux tapis. La pose d’Ash barre la colonne de l’une de ses deux cases possibles.","Une fois Ash et Jett en place, il ne reste qu’un lit libre pour Tess."]},

function moveOnce(element, gesture, duration = 280, delay = 0) {
  if (reduceMotion.matches || !element.animate) return;
  effects.get(element)?.cancel();
  effects.set(element, element.animate(gestures[gesture], {
    duration, delay, easing: "cubic-bezier(.18,.7,.3,1)"
  }));
}

function beam(element, parent) {
  element.setAttribute("aria-hidden", "true");
  element.addEventListener("animationend", () => element.remove(), { once: true });
  parent.append(element);
}

function scanPlan() {
  if (reduceMotion.matches) return;
  const layer = make("span", "board-fx");
  layer.setAttribute("aria-hidden", "true");
  const scan = make("span", "scan-beam");
  scan.addEventListener("animationend", () => layer.remove(), { once: true });
  layer.append(scan);
  board.append(layer);
}

function pulseLines(index) {
  if (reduceMotion.matches) return;
  const r = row(index) + 1;
  const c = col(index) + 1;
  const horizontal = make("span", "line-beam");
  const vertical = make("span", "line-beam column");
  horizontal.style.gridArea = r + " / 1 / " + (r + 1) + " / 9";
  vertical.style.gridArea = "1 / " + c + " / 9 / " + (c + 1);
  beam(horizontal, board);
  beam(vertical, board);
}

function readSaved() {
  try {
    return JSON.parse(localStorage.getItem(storageKey)) || {};
  } catch {
    return {};
  }
}

function save() {
  saved.active = currentCase.id;
  saved[currentCase.id] = { placements, notes: [...notes], solved, hintIndex };
  try {
    localStorage.setItem(storageKey, JSON.stringify(saved));
  } catch {
    // The standalone page also works when browser storage is unavailable.
  }
}

function make(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text) el.textContent = text;
  return el;
}

function glyph(type, wide = false) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const artwork = objectTypes[type];
  svg.setAttribute("viewBox", wide ? "0 0 80 40" : "0 0 40 40");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("stroke", "#121a28");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("stroke-linecap", "round");
  svg.innerHTML = wide ? artwork.wide : artwork.art;
  return svg;
}

function portraitMark(index, victim) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");

function person(id) { return currentCase.people.find(item => item.id === id); }
function personIndex(id) { return currentCase.people.findIndex(item => item.id === id); }
function initials(name) { return [...name].slice(0, 2).join("").toUpperCase(); }
function ownerAt(cell) { return Object.keys(placements).find(id => placements[id] === cell); }

function blocks(cell, except) {
  return Object.entries(placements).some(([id, at]) =>
    id !== except && (row(at) === row(cell) || col(at) === col(cell)));
}

function setStatus(text, kind) {
  const count = Object.keys(placements).length;
  status.textContent = text || (count + " / 8 placés" + (noteMode ? " · Mode notes" : ""));
  status.dataset.kind = kind || "";
}

function roomKey() {
  const fragment = document.createDocumentFragment();
  for (const id of roomIds) {
    const chip = make("span", "room-chip");
    chip.append(make("b", "floor-" + floorIndex(id), id), document.createTextNode(currentCase.roomNames[id]));
    fragment.append(chip);
  }
  return fragment;
}

function loadCase(item) {
  currentCase = item;
  const progress = saved[item.id] || {};
  placements = { ...progress.placements };
  notes = new Set(progress.notes || []);
  solved = Boolean(progress.solved);
  hintIndex = Number.isInteger(progress.hintIndex) ? progress.hintIndex : 0;
  selected = item.people.find(p => placements[p.id] === undefined)?.id || item.people[0].id;
  noteMode = false;
  checked = false;
  roomIds = Object.keys(item.roomNames);
  byId("case-number").textContent = " " + item.id + "/25";
  byId("case-title").textContent = item.title;
  byId("plan-title").textContent = item.venue + " · 8 × 8";
  byId("brief-difficulty").textContent = "Dossier " + item.id + " · " + item.difficulty;
  byId("brief-story").textContent = item.intro;
  byId("brief-rooms").replaceChildren(roomKey());
  document.title = item.title + " · Néon Noir";
  buildBoard();
  buildRoster();
  render();
  scanPlan();
  save();
}

function placeOverlay(overlay, start, width) {
  const r = row(start) + 1;
  const c = col(start) + 1;
  overlay.style.gridArea = r + " / " + c + " / " + (r + 1) + " / " + (c + width);
  overlay.setAttribute("aria-hidden", "true");
}

function buildRoomPlaque(id) {
  const name = currentCase.roomNames[id];
  const desired = name.length > 3 ? 2 : 1;
  let best = { index: currentCase.rooms.join("").indexOf(id), span: 1, score: -1 };
  for (let index = 0; index < 64; index++) {
    if (room(index) !== id) continue;
    let span = 1;
    while (span < desired && col(index) + span < 8 && room(index + span) === id) span++;
    let objectsInRun = 0;
    for (let i = 0; i < span; i++) objectsInRun += Number(Boolean(objectAt(index + i)));
    const topWall = row(index) === 0 || room(index - 8) !== id;
    const leftWall = col(index) === 0 || room(index - 1) !== id;
    const score = span * 100 - objectsInRun * 20 + Number(topWall) * 10 + Number(leftWall);
    if (score > best.score) best = { index, span, score };
  }
  const plaque = make("span", "room-plaque floor-" + floorIndex(id), name);
  placeOverlay(plaque, best.index, best.span);
  plaque.style.setProperty("--plaque-size", Math.min(2.45, (12.5 * best.span - 3) / (.78 * name.length)) + "cqw");
  for (let i = 0; i < best.span; i++) cells[best.index + i].button.classList.add("plaque-tile");
  return plaque;
}

function buildBoard() {
  const fragment = document.createDocumentFragment();
  const spans = currentCase.spans || [];
  const spannedCells = new Set(spans.flatMap(span => span.cells));
  cells = Array.from({ length: 64 }, (_, index) => {
    const button = make("button", "cell floor-" + floorIndex(room(index)));
    button.type = "button";
    if (col(index) < 7 && room(index + 1) !== room(index)) button.style.setProperty("--wall-right", "3px");
    if (row(index) < 7 && room(index + 8) !== room(index)) button.style.setProperty("--wall-bottom", "3px");
    const type = currentCase.objects[index];
    const object = objectAt(index);
    if (object) {
      if (!spannedCells.has(index)) {
        const art = make("span", "object");
        art.append(glyph(type));
        button.append(art);
      }
      button.classList.add("has-object");
      button.title = object.name + (object.occupiable ? " · peut être occupé" : " · obstacle");
    }
    const note = make("span", "note", "×");
    const token = make("span", "token");
    note.setAttribute("aria-hidden", "true");
    token.setAttribute("aria-hidden", "true");
    button.append(note, token);
    button.addEventListener("click", () => useCell(index));
    fragment.append(button);
    return { button, token };
  });
  furnitureSpans = spans.map(({ type, cells: footprint }) => {
    const art = make("span", "furniture-span");
    placeOverlay(art, footprint[0], footprint.length);
    art.append(glyph(type, true));
    fragment.append(art);
    return { art, type };
  });
  for (const id of roomIds) fragment.append(buildRoomPlaque(id));
  board.replaceChildren(fragment);
}

function buildRoster() {
  const fragment = document.createDocumentFragment();
  portraits = currentCase.people.map((p, i) => {
    const victim = p.id === currentCase.victim;
    const button = make("button", "person" + (victim ? " victim" : ""));
    button.type = "button";
    button.style.setProperty("--person", personColors[i]);
    const portrait = make("span", "portrait");
    portrait.append(portraitMark(i, victim));
    button.append(portrait, make("span", "person-name", p.name));
    button.addEventListener("click", () => selectPerson(p.id));
    fragment.append(button);
    return button;
  });
  roster.replaceChildren(fragment);
}

function signalSelection() {
  moveOnce(portraits[personIndex(selected)].querySelector(".portrait"), "choose");
  moveOnce(byId("clue-text").parentElement, "reveal", 240);
}

function selectPerson(id) {
  selected = id;
  noteMode = false;
  render();
  signalSelection();
}

function render() {
  const active = person(selected);
  const isPlaced = placements[selected] !== undefined;
  for (const { art, type } of furnitureSpans) art.classList.toggle("object-focus", active.items.includes(type));
  for (const [index, { button, token }] of cells.entries()) {
    const owner = ownerAt(index);
    const occupant = owner && person(owner);
    const object = objectAt(index);
    const blocked = !owner && blocks(index, selected);
    const noted = !owner && notes.has(index);
    button.classList.toggle("occupied", Boolean(owner));
    button.classList.toggle("selected-piece", owner === selected);
    button.classList.toggle("blocked", blocked);
    button.classList.toggle("noted", noted);
    button.classList.toggle("object-focus", active.items.includes(currentCase.objects[index]));
    button.classList.toggle("right", Boolean(checked && owner && placements[owner] === currentCase.solution[owner]));
    button.classList.toggle("wrong", Boolean(checked && owner && placements[owner] !== currentCase.solution[owner]));
    const label = ["Rangée " + (row(index) + 1), "colonne " + (col(index) + 1), currentCase.roomNames[room(index)]];
    if (object) label.push(object.name + (object.occupiable ? "" : " (obstacle)"));
    if (occupant) label.push(occupant.name);
    if (blocked) label.push("barrée");
    if (noted) label.push("marquée");
    button.setAttribute("aria-label", label.join(", "));
    if (occupant) {
      token.textContent = owner === currentCase.victim ? "V" : initials(occupant.name);
      token.classList.toggle("victim", owner === currentCase.victim);
      token.style.setProperty("--person", personColors[personIndex(owner)]);
    }
  }
  for (const [i, p] of currentCase.people.entries()) {
    const placed = placements[p.id] !== undefined;
    portraits[i].classList.toggle("placed", placed);
    portraits[i].setAttribute("aria-pressed", String(p.id === selected));
    portraits[i].setAttribute("aria-label", p.name + (p.id === currentCase.victim ? ", victime" : "") + (placed ? ", déjà placé" : ", à placer"));
  }
  byId("clue-name").textContent = active.name + (selected === currentCase.victim ? " · Victime" : "");
  byId("clue-state").textContent = isPlaced ? "· placé" : "· à placer";
  const clue = byId("clue-text");
  const clueKey = currentCase.id + "/" + selected;
  if (clue.dataset.key !== clueKey) {
    byId("clue-glyphs").replaceChildren(...active.items.map(type => glyph(type)));
    clue.textContent = active.clue;
    clue.dataset.key = clueKey;
  }
  byId("remove").disabled = !isPlaced;
  byId("notes").setAttribute("aria-pressed", String(noteMode));
  setStatus(solved ? "Affaire résolue · 8 / 8 placés" : "");
}

function useCell(index) {
  const owner = ownerAt(index);
  if (noteMode) {
    if (owner || objectAt(index)?.occupiable === false) {
      setStatus("Cette case est indisponible.", "bad");
      moveOnce(cells[index].button, "reject", 235);
      return;
    }
    if (notes.has(index)) notes.delete(index); else notes.add(index);
    render();
    if (notes.has(index)) moveOnce(cells[index].button.querySelector(".note"), "note", 340);
    save();
    return;
  }
  if (owner) {
    selectPerson(owner);
    return;
  }
  const object = objectAt(index);
  if (object?.occupiable === false || blocks(index, selected)) {
    setStatus(object?.occupiable === false ? object.name + " · case impraticable." : "Rangée ou colonne occupée.", "bad");
    moveOnce(cells[index].button, "reject", 235);
    return;
  }
  const who = selected;
  const moving = placements[who] !== undefined;
  placements[who] = index;
  notes.delete(index);
  checked = false;
  solved = false;
  if (!moving) selected = currentCase.people.find(p => placements[p.id] === undefined)?.id || who;
  render();
  pulseLines(index);
  moveOnce(cells[index].token, "deposit", 375);
  moveOnce(portraits[personIndex(who)].querySelector(".portrait"), "choose", 320);
  if (selected !== who) signalSelection();
  save();
}

function openDialog(title, content) {
  byId("dialog-title").textContent = title;
  dialogBody.replaceChildren(content);
  dialog.scrollTop = 0;
  if (!dialog.open) dialog.showModal();
  else moveOnce(dialogBody, "reveal", 240);
}

function action(label, handler, primary) {
  const button = make("button", "dialog-button" + (primary ? " positive" : ""), label);
  button.type = "button";
  button.addEventListener("click", handler);
  return button;
}

function openLevels() {
  showLevelPage(Math.floor(cases.indexOf(currentCase) / 5));
}

function showLevelPage(page, restoreFocus = false) {
  const body = make("div");
  const solvedCount = cases.filter(item => saved[item.id]?.solved).length;
  body.append(make("p", "season-progress", solvedCount + " / " + cases.length + " dossiers résolus"));
  const pages = make("div", "case-pages");
  pages.setAttribute("role", "group");
  pages.setAttribute("aria-label", "Groupes de dossiers");
  let activePage;
  for (let start = 0; start < cases.length; start += 5) {
    const group = start / 5;
    const end = Math.min(start + 4, cases.length - 1);
    const button = action(cases[start].id + "–" + cases[end].id, () => showLevelPage(group, true));
    button.setAttribute("aria-pressed", String(group === page));
    if (group === page) activePage = button;
    pages.append(button);
  }
  body.append(pages);
  const list = make("div", "level-list");
  for (const item of cases.slice(page * 5, page * 5 + 5)) {
    const button = make("button", "level");
    button.type = "button";
    button.setAttribute("aria-current", String(item.id === currentCase.id));
    const info = make("span");
    const progress = saved[item.id];
    const count = Object.keys(progress?.placements || {}).length;
    info.append(make("strong", "", item.title), make("small", "", item.difficulty + " · " + item.venue));
    button.append(make("span", "level-id", item.id), info,
      make("span", "technical", progress?.solved ? "Résolu" : count ? count + " / 8" : "8 × 8"));
    button.addEventListener("click", () => {
      if (currentCase.id !== item.id) loadCase(item);
      dialog.close();
    });
    list.append(button);
  }
  body.append(list);
  openDialog("Saison Cyberpunk", body);
  if (restoreFocus) activePage.focus();
}

function openLegend() {
  const body = make("div");
  body.append(make("h3", "", "Les pièces du plan"));
  const rooms = make("div", "room-key");
  rooms.append(roomKey());
  body.append(rooms);
  for (const [occupiable, label] of [[true, "Peut être occupé"], [false, "Obstacles"]]) {
    body.append(make("h3", "", label));
    const key = make("div", "object-key");
    for (const [type, object] of Object.entries(objectTypes)) {
      if (object.occupiable !== occupiable || !Object.values(currentCase.objects).includes(type)) continue;
      const item = make("span");
      item.append(glyph(type), document.createTextNode(object.name));
      key.append(item);
    }
    if (key.children.length) body.append(key);
  }
  body.append(make("p", "", "« À côté » veut dire que les deux cases partagent un bord dans la même pièce."));
  if (currentCase.spans?.length) {
    body.append(make("p", "", "Un meuble qui couvre deux cases compte une seule fois. Ses deux cases peuvent servir de repère pour un indice."));
  }
  openDialog("Objets et pièces", body);
}

function resetCurrent() {
  placements = {};
  notes.clear();
  selected = currentCase.people[0].id;
  noteMode = false;
  checked = false;
  solved = false;
  hintIndex = 0;
  render();
  save();
  dialog.close();
}

function openRules() {
  const body = make("div");
  body.append(make("p", "", currentCase.intro));
  const rules = make("ol");
  for (const text of [
    "Place les huit personnages, victime comprise. Chaque rangée et chaque colonne accueille une seule personne.",
    "Deux cases sont « à côté » si elles partagent un bord et appartiennent à la même pièce. Les cloisons et les diagonales coupent le voisinage.",
    "La légende distingue les objets sur lesquels on peut se placer des obstacles qui bloquent leur case.",
    "Choisis un personnage pour afficher son indice. Même barré, il reste sélectionnable pour être déplacé ou retiré.",
    "La victime et le coupable étaient seuls dans la même pièce. Quand le plan est juste, tu peux porter une accusation."
  ]) rules.append(make("li", "", text));
  body.append(rules);
  const controls = make("div", "dialog-actions");
  controls.append(action("Effacer les notes", () => {
    notes.clear();
    render();
    save();
    dialog.close();
  }), action("Recommencer ce dossier", () => {
    const confirm = make("div");
    confirm.append(make("p", "", "Les placements et les notes de ce dossier seront effacés."),
      action("Recommencer", resetCurrent, true));
    openDialog("Repartir de zéro", confirm);
  }));
  body.append(controls);
  openDialog("Règles et dossier " + currentCase.id, body);
}

function openHint() {
  const index = Math.min(hintIndex, currentCase.hints.length - 1);
  const body = make("div");
  body.append(make("p", "", currentCase.hints[index]));
  if (index < currentCase.hints.length - 1) {
    body.append(action("Indice suivant", () => {
      hintIndex = index + 1;
      save();
      openHint();
    }, true));
  }
  openDialog("Coup de pouce " + (index + 1) + " / " + currentCase.hints.length, body);
}

function openAccusation() {
  const victimRoom = room(placements[currentCase.victim]);
  const culprit = currentCase.people.find(p =>
    p.id !== currentCase.victim && room(placements[p.id]) === victimRoom);
  const body = make("div");
  if (solved) {
    body.append(make("div", "verdict-banner", "DOSSIER " + currentCase.id + " CLASSÉ"));
    body.append(make("p", "", culprit.name + " était la seule autre personne dans la pièce de la victime (" +
      currentCase.roomNames[victimRoom] + ")."));
    const controls = make("div", "dialog-actions");
    const next = cases[cases.indexOf(currentCase) + 1];
    if (next) {
      controls.append(action("Dossier suivant", () => {
        loadCase(next);
        dialog.close();
      }, true));
    }
    controls.append(action("Voir les dossiers", openLevels, !next));
    body.append(controls);
    openDialog("Affaire résolue", body);
    return;
  }
  body.append(make("p", "", "Les huit placements sont justes. Qui se trouvait seul avec la victime dans la même pièce ?"));
  const options = make("div", "accusations");
  const feedback = make("p");
  feedback.setAttribute("role", "status");
  for (const suspect of currentCase.people.filter(p => p.id !== currentCase.victim)) {
    options.append(action(suspect.name, () => {
      if (suspect.id !== culprit.id) {
        feedback.textContent = "Reviens au plan et repère la pièce de la victime.";
        return;
      }
      solved = true;
      render();
      save();
      openAccusation();
    }));
  }
  body.append(options, feedback);
  openDialog("Qui est coupable ?", body);
}

function checkBoard() {
  const remaining = currentCase.people.filter(p => placements[p.id] === undefined).length;
  if (remaining) {
    setStatus("Encore " + remaining + (remaining === 1 ? " personnage à placer." : " personnages à placer."), "bad");
    moveOnce(status, "reject", 235);
    return;
  }
  checked = true;
  noteMode = false;
  render();
  const wrong = currentCase.people.filter(p => placements[p.id] !== currentCase.solution[p.id]).length;
  if (wrong) {
    for (const { button, token } of cells) if (button.classList.contains("wrong")) moveOnce(token, "reject", 270);
    setStatus(wrong + (wrong === 1 ? " pose à revoir." : " poses à revoir."), "bad");
    return;
  }
  setStatus("Plan vérifié · 8 / 8 placés", "ok");
  openAccusation();
}

byId("close-dialog").addEventListener("click", () => dialog.close());
byId("levels").addEventListener("click", openLevels);
byId("legend").addEventListener("click", openLegend);
byId("rules").addEventListener("click", openRules);
byId("hint").addEventListener("click", openHint);
byId("check").addEventListener("click", checkBoard);
byId("remove").addEventListener("click", () => {
  delete placements[selected];
  solved = false;
  checked = false;
  noteMode = false;
  render();
  save();
});
byId("notes").addEventListener("click", () => {
  noteMode = !noteMode;
  render();
});

loadCase(cases.find(item => item.id === saved.active) || cases[0]);
</script>
</body>
</html>
